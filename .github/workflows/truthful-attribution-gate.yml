name: truthful-attribution-gate

# Thin caller for the org-reusable truthful-attribution-gate (cinatra-ai/ci),
# per the ratified truthful-attribution spec. WARN mode (rollout): findings are
# annotated, the check is ALWAYS green - it never fails a PR.
#
# Double-pinned: the `uses:` ref and the `ref` input below name the SAME
# cinatra-ai/ci commit (1e40675e), and .github/gate-suite.json names that commit
# as the `pinned` engine of this context's requiredContexts row - move all three
# in one commit. That commit carries no release tag (it follows v0.1.4), so the
# version comment `# v0.1.4-next.1e40675` names its short sha as a semver
# pre-release marker rather than claiming a tag.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  # actions:read is MANDATORY: the reusable gate reads its own Actions run via the
  # REST API to verify it is running at the pinned workflow SHA. With an explicit
  # permissions block, any omitted scope defaults to `none`, and a called reusable
  # workflow cannot exceed the caller's grant -- so omitting this makes the job
  # fail to start (a red/missing check that warn mode cannot rescue, because it
  # fails before any step runs). Do not drop this line.
  actions: read

jobs:
  truthful-attribution-gate:                 # caller job id MUST stay this exact string
    uses: cinatra-ai/ci/.github/workflows/truthful-attribution-gate.yml@1e40675e1642dcc32d195f27b3deb285b4d3d6fc # v0.1.4-next.1e40675
    with:
      mode: warn
      ref: 1e40675e1642dcc32d195f27b3deb285b4d3d6fc # same SHA as the workflow @ref
